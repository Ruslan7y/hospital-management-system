<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resepsiyon Paneli - Profil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .active-link { background-color: #6d28d9; color: white; font-weight: 600; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="flex min-h-screen">
        <aside class="w-72 bg-[#1e293b] text-gray-300 flex flex-col p-6 shadow-2xl">
            <div class="mb-10 text-center border-b border-gray-700 pb-6">
                <h1 class="text-2xl font-bold text-white tracking-tight">Reception Paneli</h1>
                <p class="text-xs mt-2 text-purple-400 uppercase font-semibold">Görevli</p>
                <p id="sidebar-user-name" class="text-white font-bold mt-2 text-lg"></p>
            </div>
            <nav class="flex-grow">
                <ul class="space-y-3">
                    <li>
                        <a href="reception_panel.html" class="active-link flex items-center p-3 rounded-xl transition-all">
                            Profil Bilgileri
                        </a>
                    </li>
                    <li>
                        <a href="hrandevu_yonetimi.html" class="flex items-center p-3 rounded-xl hover:bg-gray-700 transition-all">
                            Randevu Yönetimi
                        </a>
                    </li>
                    <li>
    <a href="islemler.html" class="flex items-center p-3 rounded-xl hover:bg-gray-700 transition-all">
        İşlemler
    </a>
</li>
                    <li>
                        <a href="#" class="flex items-center p-3 rounded-xl hover:bg-gray-700 transition-all">
                            Hasta Kayıt
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="mt-auto pt-6 border-t border-gray-700">
                <button onclick="cikisYap()" class="w-full flex items-center justify-center p-3 rounded-xl bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white transition-all font-bold">
                    Çıkış Yap
                </button>
            </div>
        </aside>

        <main class="flex-1 p-10 overflow-y-auto">
            <header class="mb-10 flex justify-between items-center">
                <h2 id="hastane-basligi" class="text-3xl font-extrabold text-gray-800 uppercase tracking-tighter tracking-tight"></h2>
                <div class="bg-white px-4 py-2 rounded-full shadow-sm flex items-center border border-gray-200">
                    <div class="w-3 h-3 bg-green-500 rounded-full mr-2"></div>
                    <span class="text-sm font-medium text-gray-600">Sistem Aktif</span>
                </div>
            </header>

            <section class="max-w-4xl mx-auto">
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
                    <div class="h-32 bg-gradient-to-r from-purple-600 to-indigo-700"></div>
                    <div class="px-8 pb-10 -mt-16">
                        <div class="flex items-end mb-8">
                            <div class="w-32 h-32 bg-white rounded-2xl shadow-lg flex items-center justify-center border-4 border-white overflow-hidden text-3xl font-bold text-purple-600" id="profil-bas-harfler"></div>
                            <div class="ml-6 mb-2">
                                <h3 id="profil-ad-soyad" class="text-3xl font-bold text-gray-900 leading-none"></h3>
                                <p class="text-purple-600 font-medium mt-1">Hastaneye Kayıtlı Resepsiyon Görevlisi</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-6">
                                <h4 class="text-lg font-bold text-gray-800 border-b pb-2">Kişisel Bilgiler</h4>
                                <div class="flex items-center"><span class="w-32 text-gray-500 font-medium">T.C. Kimlik:</span><span id="detay-tc" class="font-semibold text-gray-800"></span></div>
                                <div class="flex items-center"><span class="w-32 text-gray-500 font-medium">Doğum Tarihi:</span><span id="detay-dogum" class="font-semibold text-gray-800"></span></div>
                                <div class="flex items-center"><span class="w-32 text-gray-500 font-medium">Telefon:</span><span id="detay-telefon" class="font-semibold text-gray-800"></span></div>
                            </div>
                            <div class="space-y-6">
                                <h4 class="text-lg font-bold text-gray-800 border-b pb-2">Hesap Detayları</h4>
                                <div class="flex items-center"><span class="w-32 text-gray-500 font-medium">E-posta:</span><span id="detay-mail" class="font-semibold text-gray-800"></span></div>
                                <div class="flex items-center"><span class="w-32 text-gray-500 font-medium">Kayıt Tarihi:</span><span id="detay-kayit" class="font-semibold text-gray-600"></span></div>
                                <div class="flex items-center"><span class="w-32 text-gray-500 font-medium">Hastane No:</span><span id="detay-hastane" class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-bold"></span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        window.onload = async () => {
            const receptionId = localStorage.getItem('receptionId');
            if (!receptionId) { window.location.href = 'reception_giris.html'; return; }

            try {
                const response = await fetch(`http://localhost:5000/reception-panel/veri/${receptionId}`);
                const veri = await response.json();

                // Bilgileri DOM'a yerleştirme
                document.getElementById('sidebar-user-name').textContent = `${veri.isim} ${veri.soyisim}`;
                document.getElementById('hastane-basligi').textContent = veri.hastaneAdi;
                document.getElementById('profil-ad-soyad').textContent = `${veri.isim} ${veri.soyisim}`;
                document.getElementById('profil-bas-harfler').textContent = (veri.isim[0] + veri.soyisim[0]).toUpperCase();
                document.getElementById('detay-tc').textContent = veri.tc;
                document.getElementById('detay-dogum').textContent = new Date(veri.dogumTarihi).toLocaleDateString('tr-TR');
                document.getElementById('detay-telefon').textContent = veri.telefon;
                document.getElementById('detay-mail').textContent = veri.mail;
                document.getElementById('detay-kayit').textContent = new Date(veri.kayitTarihi).toLocaleString('tr-TR');
                document.getElementById('detay-hastane').textContent = `#${veri.hastaneId}`;

                // Sonraki sayfa için hastane bilgilerini sakla
                localStorage.setItem('hastaneId', veri.hastaneId);
                localStorage.setItem('hastaneAdi', veri.hastaneAdi);
                localStorage.setItem('userName', `${veri.isim} ${veri.soyisim}`);

            } catch (error) { console.error("Hata:", error); }
        };

        function cikisYap() {
            if (confirm('Çıkış yapmak istediğinize emin misiniz?')) {
                localStorage.clear();
                window.location.href = 'reception_giris.html';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Profilini Tamamla</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg border-t-4 border-purple-600">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Hoş Geldiniz!</h2>
        <p class="text-gray-600 mb-6">Lütfen hesabınızı aktif etmek için eksik bilgileri doldurun ve yeni bir şifre belirleyin.</p>
        
        <form id="profilForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">T.C. Kimlik No</label>
                    <input type="text" id="tc" maxlength="11" required class="w-full p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Doğum Tarihi</label>
                    <input type="date" id="dogumTarihi" required class="w-full p-2 border rounded-lg">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Telefon Numarası</label>
                <input type="tel" id="telefon" placeholder="05XX XXX XX XX" required class="w-full p-2 border rounded-lg">
            </div>
            <hr>
            <div>
                <label class="block text-sm font-medium text-gray-700 text-purple-700 font-bold">Yeni Kalıcı Şifre</label>
                <input type="password" id="yeniSifre" required class="w-full p-2 border-2 border-purple-200 rounded-lg focus:border-purple-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-purple-600 text-white p-3 rounded-lg font-bold hover:bg-purple-700 transition">Hesabı Aktifleştir ve Panele Git</button>
        </form>
    </div>

    <script>
        document.getElementById('profilForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const receptionId = localStorage.getItem('receptionId');

            const veri = {
                receptionId,
                tc: document.getElementById('tc').value,
                dogumTarihi: document.getElementById('dogumTarihi').value,
                telefon: document.getElementById('telefon').value,
                yeniSifre: document.getElementById('yeniSifre').value
            };

            const response = await fetch('http://localhost:5000/reception/profil-tamamla', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(veri)
            });

            if (response.ok) {
                alert("Profiliniz güncellendi! Giriş yapılıyor...");
                window.location.href = 'reception_panel.html';
            } else {
                alert("Güncelleme sırasında hata oluştu.");
            }
        });
    </script>
</body>
</html>

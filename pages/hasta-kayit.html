<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasta Kayıt - Sağlık Portalı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50">

    <!-- HEADER -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="container mx-auto flex items-center justify-between p-4">
            <div class="text-2xl font-bold text-blue-600">
                <a href="../saglik.html">Sağlık Portalı</a>
            </div>

            <ul class="hidden md:flex items-center space-x-8 font-semibold text-gray-600">
                <li><a href="../saglik.html" class="hover:text-blue-600 transition-colors">Ana Sayfa</a></li>
                <li><a href="#" class="hover:text-blue-600 transition-colors">Doktorlarımız</a></li>
                <li><a href="#" class="hover:text-blue-600 transition-colors">Hizmetlerimiz</a></li>
                <li><a href="#" class="hover:text-blue-600 transition-colors">İletişim</a></li>
            </ul>

            <!-- GİRİŞ YAP BUTONU -->
            <div>
                <a href="login.html"
                   class="bg-blue-600 text-white font-bold px-5 py-2.5 rounded-lg hover:bg-blue-700 transition-all duration-300 shadow">
                    Giriş Yap
                </a>
            </div>
        </nav>
    </header>

    <!-- MAIN -->
    <main class="flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg mt-10">
            <div>
                <h2 class="text-center text-3xl font-extrabold text-gray-900">
                    Yeni Hasta Kayıt
                </h2>
            </div>

            <div id="message-area" class="mt-4"></div>

            <form id="kayit-formu" class="mt-8 space-y-6">

                <!-- Ad -->
                <div>
                    <label for="ad" class="block text-sm font-medium text-gray-700">Ad</label>
                    <input id="ad" name="ad" type="text" required
                        class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-md shadow-sm 
                               focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="Adınız">
                </div>

                <!-- Soyad -->
                <div>
                    <label for="soyad" class="block text-sm font-medium text-gray-700">Soyad</label>
                    <input id="soyad" name="soyad" type="text" required
                        class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-md shadow-sm 
                               focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="Soyadınız">
                </div>

                <!-- E-Posta -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">E-posta</label>
                    <input id="email" name="email" type="email" autocomplete="email" required
                        class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-md shadow-sm 
                               focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="E-posta Adresiniz">
                </div>

                <!-- T.C. Kimlik No -->
                <div>
                    <label for="tcKimlik" class="block text-sm font-medium text-gray-700">T.C. Kimlik No</label>
                    <input id="tcKimlik" name="tcKimlik" type="text" maxlength="11" pattern="[0-9]{11}" required
                        class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-md shadow-sm 
                               focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="11 haneli kimlik numaranız">
                    <p class="text-xs text-gray-500 mt-1">⚠️ T.C. kimlik numarası 11 rakamdan oluşmalıdır.</p>
                </div>

                <!-- Doğum Yılı -->
                <div>
                    <label for="dogumYili" class="block text-sm font-medium text-gray-700">Doğum Yılı</label>
                    <input id="dogumYili" name="dogumYili" type="number" min="1900" max="2025" required
                        class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-md shadow-sm 
                               focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="YYYY">
                </div>

                <!-- Telefon -->
                <div>
                    <label for="telefon" class="block text-sm font-medium text-gray-700">Telefon</label>
                    <input id="telefon" name="telefon" type="tel" maxlength="15" required
                        class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-md shadow-sm 
                               focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="05xx xxx xx xx">
                </div>

                <!-- Şifre -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Şifre</label>
                    <input id="password" name="password" type="password" required
                        class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-md shadow-sm 
                               focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="Şifreniz">
                </div>

                <!-- Şifre Tekrar -->
                <div>
                    <label for="passwordTekrar" class="block text-sm font-medium text-gray-700">Şifre (Tekrar)</label>
                    <input id="passwordTekrar" name="passwordTekrar" type="password" required
                        class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-md shadow-sm 
                               focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="Şifrenizi tekrar giriniz">
                </div>

                <!-- Kayıt Ol Butonu -->
                <div>
                    <button type="submit"
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium 
                               rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Kayıt Ol
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById('kayit-formu');
        const messageArea = document.getElementById('message-area');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            messageArea.innerHTML = '';

            const ad = document.getElementById('ad').value.trim();
            const soyad = document.getElementById('soyad').value.trim();
            const email = document.getElementById('email').value.trim();
            const tcKimlik = document.getElementById('tcKimlik').value.trim();
            const dogumYili = document.getElementById('dogumYili').value.trim();
            const telefon = document.getElementById('telefon').value.trim();
            const sifre = document.getElementById('password').value;
            const sifreTekrar = document.getElementById('passwordTekrar').value;

            // T.C. Kimlik kontrolü
            if (tcKimlik.length !== 11 || !/^[0-9]+$/.test(tcKimlik)) {
                messageArea.innerHTML = `
                    <div class="bg-yellow-100 border border-yellow-400 text-yellow-800 px-4 py-3 rounded" role="alert">
                        ⚠️ Lütfen geçerli bir 11 haneli T.C. kimlik numarası giriniz.
                    </div>`;
                return;
            }

            // Şifre eşleşme kontrolü
            if (sifre !== sifreTekrar) {
                messageArea.innerHTML = `
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded" role="alert">
                        ❌ Şifreler birbiriyle eşleşmiyor. Lütfen kontrol edin.
                    </div>`;
                return;
            }

            const kayitVerisi = { ad, soyad, email, sifre, tcKimlik, dogumYili, telefon };

            try {
                const response = await fetch('http://localhost:5000/kayit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(kayitVerisi)
                });

                const data = await response.json();

                if (response.ok) {
                    messageArea.innerHTML = `
                        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded" role="alert">
                            ✅ ${data.mesaj} Giriş sayfasına yönlendiriliyorsunuz...
                        </div>`;
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    messageArea.innerHTML = `
                        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded" role="alert">
                            ${data.mesaj}
                        </div>`;
                }
            } catch (error) {
                console.error('Sunucuya bağlanırken hata oluştu:', error);
                messageArea.innerHTML = `
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded" role="alert">
                        Sunucuya bağlanılamadı. Lütfen sunucunun çalıştığından emin olun.
                    </div>`;
            }
        });
    </script>

</body>
</html>

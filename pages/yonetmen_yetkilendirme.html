<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Yetkilendirme - Sağlık Portalı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .active-link { background-color: #4f46e5; color: white; }
    </style>
</head>
<body class="bg-gray-100">

    <div class="flex h-screen">
        <div class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="px-8 py-6 border-b border-gray-700">
                <h2 class="text-2xl font-semibold">Admin Paneli</h2>
                <span class="text-sm text-gray-400">Sağlık Portalı</span>
            </div>
            <nav class="flex-1 px-4 py-4 space-y-2">
                <a href="admin_kontrol.html" class="flex items-center px-4 py-2 rounded-lg transition-colors hover:bg-gray-700">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Gösterge Paneli
                </a>
                <a href="yonetmen_yetkilendir.html" class="flex items-center px-4 py-2 rounded-lg transition-colors hover:bg-gray-700 active-link">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Yetkilendirme
                </a>
                <a href="#" class="flex items-center px-4 py-2 rounded-lg transition-colors hover:bg-gray-700">
                     <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M15 21a6 6 0 00-9-5.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-3-5.197z"></path></svg>
                    Kullanıcı Yönetimi
                </a>
                <a href="#" class="flex items-center px-4 py-2 rounded-lg transition-colors hover:bg-gray-700">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Sistem
                </a>
            </nav>
            <div class="px-8 py-6 border-t border-gray-700">
                <a href="login.html" id="cikisYapButonu" class="w-full text-center block bg-red-600 hover:bg-red-700 rounded-lg py-2 transition-colors">Çıkış Yap</a>
            </div>
        </div>

        <main class="flex-1 p-10 overflow-y-auto">
            <section id="yetkilendirme">
                <h1 class="text-3xl font-bold text-gray-800 mb-6">Hastane Yonetmeni  Yetkilendirme İstekleri</h1>
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="bg-gray-50 border-b">
                                    <th class="py-3 px-4 font-semibold text-sm text-gray-600">Başvuran Bilgileri</th>
                                    <th class="py-3 px-4 font-semibold text-sm text-gray-600">Kurum Bilgileri</th>
                                    <th class="py-3 px-4 font-semibold text-sm text-gray-600">Başvuru Tarihi</th>
                                    <th class="py-3 px-4 font-semibold text-sm text-gray-600 text-center">İşlemler</th>
                                </tr>
                            </thead>
                            <tbody id="yetkilendirmeTablosu">
                                </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const yetkilendirmeTablosu = document.getElementById('yetkilendirmeTablosu');

        async function bekleyenBasvurulariYukle() {
            try {
                const response = await fetch('http://localhost:5000/yonetici/bekleyen-basvurular');
                const basvurular = await response.json();
                yetkilendirmeTablosu.innerHTML = '';
                if (basvurular.length === 0) {
                    yetkilendirmeTablosu.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-gray-500">Onay bekleyen başvuru bulunmuyor.</td></tr>';
                    return;
                }
                basvurular.forEach(basvuru => {
                    const tarih = new Date(basvuru.BasvuruTarihi).toLocaleDateString('tr-TR');
                    const satir = `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="py-3 px-4">
                                <div class="font-medium text-gray-800">${basvuru.Ad} ${basvuru.Soyad}</div>
                                <div class="text-sm text-gray-500">${basvuru.Email}</div>
                            </td>
                            <td class="py-3 px-4">
                                <div class="font-medium text-gray-800">${basvuru.HastaneAdi}</div>
                                <div class="text-sm text-gray-500">${basvuru.Sehir} / ${basvuru.Unvan}</div>
                            </td>
                            <td class="py-3 px-4 text-sm text-gray-600">${tarih}</td>
                            <td class="py-3 px-4 text-center space-x-2">
                                <button onclick="onayla(${basvuru.BasvuruID})" class="bg-green-500 hover:bg-green-600 text-white text-sm font-medium py-1 px-3 rounded-md transition-colors">Onayla</button>
                                <button onclick="reddet(${basvuru.BasvuruID})" class="bg-red-500 hover:bg-red-600 text-white text-sm font-medium py-1 px-3 rounded-md transition-colors">Reddet</button>
                            </td>
                        </tr>`;
                    yetkilendirmeTablosu.innerHTML += satir;
                });
            } catch (error) {
                console.error('Başvurular yüklenirken hata oluştu:', error);
                yetkilendirmeTablosu.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-red-500">Başvurular yüklenemedi. Sunucu çalışmıyor olabilir.</td></tr>';
            }
        }

        async function onayla(basvuruID) {
            if (!confirm('Bu başvuruyu onaylamak istediğinizden emin misiniz?')) return;
            try {
                const response = await fetch(`http://localhost:5000/yonetici/onayla/${basvuruID}`, { method: 'POST' });
                const data = await response.json();
                alert(data.mesaj);
                if (response.ok) bekleyenBasvurulariYukle();
            } catch (error) {
                alert('Sunucuyla iletişim kurarken bir hata oluştu.');
            }
        }

        function reddet(basvuruID) {
            alert(`Reddetme işlemi için backend kodu yazılmalıdır. ID: ${basvuruID}`);
        }

        document.addEventListener('DOMContentLoaded', bekleyenBasvurulariYukle);

        document.getElementById('cikisYapButonu').addEventListener('click', function(event) {
            event.preventDefault();
            if (confirm('Çıkış yapmak istediğinizden emin misiniz?')) {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr"> 
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yapay Zeka Doktor Asistanı - Sohbet</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'inter': ['Inter', 'sans-serif'] },
                    colors: {
                        'indigo-primary': '#4f46e5', 
                        'indigo-light': '#eeefff',
                        'cyan': { '500': '#00C1D4', '600': '#00A9BB' }
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; 
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 flex">
    
    <main class="flex flex-1 h-screen">
        
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col hidden sm:flex overflow-y-auto shrink-0">
            <div class="p-4 border-b border-gray-200 sticky top-0 bg-white z-10">
                <button onclick="newChat()"
                    class="w-full bg-cyan-500 text-white font-semibold py-2 rounded-lg hover:bg-cyan-600 transition-colors flex items-center justify-center shadow-md">
                    <i class="fas fa-plus mr-2"></i> Yeni Sohbet
                </button>
                
                <a href="rontgen_tespit.html"
                    class="w-full mt-2 bg-indigo-primary text-white font-semibold py-2 rounded-lg hover:bg-indigo-primary/90 transition-colors flex items-center justify-center shadow-md">
                    <i class="fas fa-x-ray mr-2"></i> Röntgen Analizi
                </a>
            </div>
            
            <div class="p-4 text-xs font-semibold text-gray-500 uppercase">
                Geçmiş Sohbetler
            </div>

            <nav id="chat-history" class="flex-1 px-2 space-y-1 pb-4">
                <a href="#" class="flex items-center p-2 text-sm text-gray-700 rounded-lg hover:bg-gray-100 transition-colors group truncate" onclick="loadChat(1)">
                    <i class="fas fa-history mr-3 text-gray-400 group-hover:text-indigo-primary"></i>
                    <span class="truncate">Baş Ağrısı Şikayeti</span>
                </a>
                <a href="#" class="flex items-center p-2 text-sm text-gray-700 rounded-lg bg-indigo-light transition-colors group truncate" onclick="loadChat(2)">
                    <i class="fas fa-history mr-3 text-gray-700"></i>
                    <span class="truncate">Mide Bulantısı ve Ateş</span>
                </a>
            </nav>
        </aside>

        <section class="flex-1 flex flex-col bg-gray-50 overflow-hidden">
            
            <div class="p-4 border-b border-gray-200 bg-white shadow-sm flex items-center justify-between shrink-0">
                <h1 id="main-title" class="text-xl font-bold text-indigo-primary flex items-center">
                    <i class="fas fa-robot mr-3 text-cyan-500"></i> Yardımcı Doktor AI
                </h1>
                
                <a href="doktor_paneli.html"
                   class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 transition-colors">
                    <i class="fas fa-arrow-left mr-2"></i> Panele Geri Dön
                </a>
            </div>

            <div id="chat-output" class="flex-1 overflow-y-auto p-6 space-y-4">
                </div>

            <div class="p-4 bg-white border-t border-gray-200 shadow-lg shrink-0">
                <div class="flex items-center max-w-4xl mx-auto">
                    <input type="text" id="user-input" placeholder="Şikayetlerinizi buraya yazın..."
                        class="flex-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-primary focus:border-indigo-primary transition-all text-gray-700 shadow-inner"
                        onkeydown="if(event.key === 'Enter') sendMessage()">
                    
                    <button id="send-button" onclick="sendMessage()"
                        class="ml-3 bg-indigo-primary text-white p-3 rounded-lg hover:bg-indigo-primary/90 transition-colors font-semibold shadow-md disabled:bg-gray-400">
                        <i class="fas fa-paper-plane"></i> Gönder
                    </button>
                </div>
                <p class="text-xs text-center text-gray-500 mt-2">Bu bir yapay zeka asistanıdır. Tıbbi teşhis veya tedavi yerine geçmez.</p>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            loadChatIntro();
            document.getElementById('send-button').disabled = false;
        });

        function loadChatIntro() {
            document.getElementById('chat-output').innerHTML = `
                <div class="flex justify-start">
                    <div class="max-w-3xl bg-indigo-light border border-indigo-primary/30 p-4 rounded-xl shadow-sm">
                        <p class="font-semibold text-indigo-primary mb-1"><i class="fas fa-stethoscope mr-2"></i> Sağlık Dostu:</p>
                        <p class="text-gray-700">Merhaba, ben Yapay Zeka Doktor Asistanınız. Bir doktordan kesinlikle **tıbbi tavsiye almadığınızı** unutmayın. Lütfen şikayetinizi ve belirtilerinizi detaylıca anlatın. Size yol göstermek için buradayım.</p>
                    </div>
                </div>
            `;
            document.getElementById('user-input').focus();
        }

        async function sendMessage() {
            alert("Sohbet gönderme fonksiyonu çağrıldı. API'niz hazırsa buraya entegre edin.");
        }
        
        function newChat() {
            loadChatIntro();
        }

        function loadChat(chatId) {
            alert('Sohbet ID: ' + chatId + ' yüklenecek.');
        }
    </script>
</body>
</html>

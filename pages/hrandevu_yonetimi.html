<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Randevu Yönetimi - Hasta Kabul</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100 flex min-h-screen">

    <aside class="w-72 bg-[#1e293b] text-gray-300 flex flex-col p-6 shadow-2xl">
        <div class="mb-10 text-center border-b border-gray-700 pb-6">
            <h1 class="text-2xl font-bold text-white tracking-tight">Reception Paneli</h1>
            <p class="text-xs mt-2 text-purple-400 font-semibold uppercase">Görevli</p>
            <p id="sidebar-ad" class="text-white font-bold mt-1 text-lg"></p>
        </div>
        <nav class="flex-grow space-y-3">
            <a href="reception_panel.html" class="flex items-center p-3 rounded-xl hover:bg-gray-700 transition-all">Profil Bilgileri</a>
            <a href="hrandevu_yonetimi.html" class="flex items-center p-3 rounded-xl bg-purple-600 text-white font-bold transition-all shadow-lg border-l-4 border-purple-400">Randevu Yönetimi</a>
            <a href="islemler.html" class="flex items-center p-3 rounded-xl hover:bg-gray-700 transition-all">İşlemler</a>
            <a href="#" class="flex items-center p-3 rounded-xl hover:bg-gray-700 transition-all">Hasta Kayıt</a>
        </nav>
        <div class="mt-auto pt-6 border-t border-gray-700">
            <button onclick="cikisYap()" class="w-full flex items-center justify-center p-3 rounded-xl bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white transition-all font-bold">
                Çıkış Yap
            </button>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <header class="mb-8 text-center">
            <h2 id="hastane-adi" class="text-3xl font-extrabold text-gray-800 uppercase tracking-tighter"></h2>
            <p class="text-gray-500 mt-2 text-lg font-medium italic">Henüz Giriş Yapmamış Hastalar</p>
        </header>

        <div class="max-w-5xl mx-auto mb-6 bg-white p-6 rounded-3xl shadow-sm border border-gray-200">
            <div class="flex flex-wrap gap-4 mb-4">
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-xs font-bold text-gray-400 mb-1 uppercase ml-1">İsim / Soyisim</label>
                    <input type="text" id="searchName" placeholder="Arama yapın..." 
                        class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none transition-all">
                </div>
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-xs font-bold text-gray-400 mb-1 uppercase ml-1">T.C. Kimlik No</label>
                    <input type="text" id="searchTC" placeholder="TC girin..." maxlength="11"
                        class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none transition-all">
                </div>
            </div>
            
            <div class="flex gap-3 border-t pt-4">
                <button onclick="setDateFilter('today')" id="btn-today" 
                    class="px-6 py-2 rounded-xl font-bold text-sm transition-all border-2 border-purple-600 bg-purple-600 text-white shadow-md">
                    Bugünkü Randevular
                </button>
                <button onclick="setDateFilter('all')" id="btn-all" 
                    class="px-6 py-2 rounded-xl font-bold text-sm transition-all border-2 border-gray-200 text-gray-500 hover:bg-gray-50">
                    Tüm Randevular
                </button>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-200">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b border-gray-200 text-xs uppercase text-gray-400">
                    <tr>
                        <th class="px-6 py-4 font-bold">Hasta Bilgisi</th>
                        <th class="px-6 py-4 font-bold">Doktor</th>
                        <th class="px-6 py-4 font-bold">Tarih / Saat</th>
                        <th class="px-6 py-4 font-bold">R. Durumu</th>
                        <th class="px-6 py-4 font-bold">İşlem</th>
                    </tr>
                </thead>
                <tbody id="randevu-tablo-body" class="divide-y divide-gray-100 text-sm"></tbody>
            </table>
        </div>
    </main>

    <script>
        let allAppointments = []; 
        let currentFilter = 'today';

        window.onload = async () => {
            const hastaneId = localStorage.getItem('hastaneId');
            const receptionId = localStorage.getItem('receptionId');
            const storedName = localStorage.getItem('userName');
            
            document.getElementById('hastane-adi').textContent = localStorage.getItem('hastaneAdi');
            document.getElementById('sidebar-ad').textContent = storedName || "Görevli";

            try {
                await loadAppointments();
            } catch (error) {
                console.error("Veri yükleme hatası:", error);
            }
        };

        async function loadAppointments() {
            const hastaneId = localStorage.getItem('hastaneId');
            const response = await fetch(`http://localhost:5000/reception/hastane-randevulari/${hastaneId}`);
            allAppointments = await response.json();
            applyFilters();
        }

        async function hastaAktivEt(randevuId) {
            if (!confirm('Hastanın hastaneye geldiğini ve bekleme listesine alınacağını onaylıyor musunuz?')) return;

            try {
                const response = await fetch(`http://localhost:5000/reception/randevu-onay-guncelle`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ randevuId, yeniDurum: 'Aktif' })
                });

                if (response.ok) {
                    alert('Hasta kabulü yapıldı. Hasta "İşlemler" listesine aktarıldı.');
                    await loadAppointments(); // Tabloyu yeniler, filtre sayesinde Aktif olanlar kaybolur.
                } else {
                    alert('İşlem başarısız.');
                }
            } catch (error) {
                console.error('Hata:', error);
            }
        }

        function setDateFilter(filter) {
            currentFilter = filter;
            document.getElementById('btn-today').className = filter === 'today' ? "px-6 py-2 rounded-xl font-bold text-sm transition-all border-2 border-purple-600 bg-purple-600 text-white shadow-md" : "px-6 py-2 rounded-xl font-bold text-sm transition-all border-2 border-gray-200 text-gray-500 hover:bg-gray-50";
            document.getElementById('btn-all').className = filter === 'all' ? "px-6 py-2 rounded-xl font-bold text-sm transition-all border-2 border-purple-600 bg-purple-600 text-white shadow-md" : "px-6 py-2 rounded-xl font-bold text-sm transition-all border-2 border-gray-200 text-gray-500 hover:bg-gray-50";
            applyFilters();
        }

        function applyFilters() {
            const nameQuery = document.getElementById('searchName').value.toLowerCase();
            const tcQuery = document.getElementById('searchTC').value;
            const todayStr = new Date().toLocaleDateString('en-CA'); 

            const filtered = allAppointments.filter(r => {
                const matchesName = (r.hastaAdSoyad || "").toLowerCase().includes(nameQuery);
                const matchesTC = (r.TcKimlikNo || "").includes(tcQuery);
                const appointmentDate = new Date(r.randevu_tarihi).toLocaleDateString('en-CA');
                const matchesDate = currentFilter === 'all' || appointmentDate === todayStr;
                
                // SADECE randevu_onay 'Aktif' OLMAYANLARI göster (Deaktifleri göster)
                const isDeaktif = r.randevu_onay !== 'Aktif';

                return matchesName && matchesTC && matchesDate && isDeaktif;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const tabloBody = document.getElementById('randevu-tablo-body');
            tabloBody.innerHTML = data.length > 0 ? data.map(r => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4">
                        <div class="font-bold text-gray-900">${r.hastaAdSoyad}</div>
                        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">TC: ${r.TcKimlikNo}</div>
                    </td>
                    <td class="px-6 py-4 text-gray-600 font-medium">Dr. ${r.doktorAdSoyad}</td>
                    <td class="px-6 py-4 text-gray-500">
                        ${new Date(r.randevu_tarihi).toLocaleDateString('tr-TR')} 
                        <span class="text-purple-600 font-bold ml-1">
                            ${new Date(r.randevu_tarihi).toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'})}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-gray-400 font-bold text-xs uppercase">
                        ${r.randevu_durumu || 'Beklemede'}
                    </td>
                    <td class="px-6 py-4">
                        <button onclick="hastaAktivEt(${r.randevu_id})" 
                            class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-indigo-700 transition shadow-sm">
                            Giriş Yap / Aktif Et
                        </button>
                    </td>
                </tr>`).join('') : `<tr><td colspan="5" class="p-10 text-center text-gray-400 font-medium">Giriş yapması beklenen hasta bulunamadı.</td></tr>`;
        }

        function cikisYap() {
            if (confirm('Çıkış yapmak istediğinize emin misiniz?')) {
                localStorage.clear();
                window.location.href = 'reception_giris.html';
            }
        }

        document.getElementById('searchName').addEventListener('input', applyFilters);
        document.getElementById('searchTC').addEventListener('input', applyFilters);
    </script>
</body>
</html>

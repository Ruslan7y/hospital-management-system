<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Kaydı - Sağlık Portalı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-12">

    <div class="w-full max-w-2xl p-8 space-y-8 bg-white rounded-2xl shadow-xl">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-gray-900">Yönetici Kayıt Başvurusu</h1>
            <p class="mt-2 text-gray-600">Lütfen bilgilerinizi eksiksiz doldurun. Başvurunuz admin onayı sonrası aktif olacaktır.</p>
        </div>
        
        <form id="yoneticiKayitForm" class="mt-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="ad" class="block text-sm font-medium text-gray-700">Ad</label>
                    <input id="ad" name="ad" type="text" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="soyad" class="block text-sm font-medium text-gray-700">Soyad</label>
                    <input id="soyad" name="soyad" type="text" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="md:col-span-2">
                    <label for="email" class="block text-sm font-medium text-gray-700">E-Posta Adresi</label>
                    <input id="email" name="email" type="email" autocomplete="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="telefon" class="block text-sm font-medium text-gray-700">Telefon (İsteğe Bağlı)</label>
                    <input id="telefon" name="telefon" type="tel" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="sehir" class="block text-sm font-medium text-gray-700">Şehir</-label>
                    <input id="sehir" name="sehir" type="text" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="md:col-span-2">
                    <label for="hastaneAdi" class="block text-sm font-medium text-gray-700">Hastane Adı</label>
                    <input id="hastaneAdi" name="hastaneAdi" type="text" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="md:col-span-2">
                    <label for="unvan" class="block text-sm font-medium text-gray-700">Ünvan (Örn: Hastane Müdürü)</label>
                    <input id="unvan" name="unvan" type="text" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                    Başvuruyu Gönder
                </button>
            </div>
        </form>

        <div id="mesajAlani" class="text-center mt-4 text-sm"></div>
    </div>

    <script>
        document.getElementById('yoneticiKayitForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const mesajAlani = document.getElementById('mesajAlani');
            mesajAlani.textContent = '';

            const formData = {
                ad: document.getElementById('ad').value,
                soyad: document.getElementById('soyad').value,
                email: document.getElementById('email').value,
                telefon: document.getElementById('telefon').value,
                sehir: document.getElementById('sehir').value,
                hastaneAdi: document.getElementById('hastaneAdi').value,
                unvan: document.getElementById('unvan').value,
            };

            try {
                const response = await fetch('http://localhost:5000/yonetici/basvuru', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    mesajAlani.textContent = data.mesaj;
                    mesajAlani.className = 'text-center mt-4 text-sm text-green-600';
                    document.getElementById('yoneticiKayitForm').reset();
                } else {
                    mesajAlani.textContent = data.mesaj;
                    mesajAlani.className = 'text-center mt-4 text-sm text-red-600';
                }
            } catch (error) {
                mesajAlani.textContent = 'Sunucuya bağlanırken bir hata oluştu. Lütfen tekrar deneyin.';
                mesajAlani.className = 'text-center mt-4 text-sm text-red-600';
            }
        });
    </script>

</body>
</html>

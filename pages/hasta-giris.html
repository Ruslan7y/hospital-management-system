<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasta Girişi - Sağlık Portalı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50">

    <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="container mx-auto flex items-center justify-between p-4">
            <div class="text-2xl font-bold text-blue-600">
                <a href="../saglik.html">Sağlık Portalı</a>
            </div>
            <ul class="hidden md:flex items-center space-x-8 font-semibold text-gray-600">
                <li><a href="../saglik.html" class="hover:text-blue-600 transition-colors">Ana Sayfa</a></li>
                <li><a href="#" class="hover:text-blue-600 transition-colors">Doktorlarımız</a></li>
                <li><a href="#" class="hover:text-blue-600 transition-colors">Hizmetlerimiz</a></li>
                <li><a href="#" class="hover:text-blue-600 transition-colors">İletişim</a></li>
            </ul>
            <div>
                <a href="hasta-kayit.html" class="bg-blue-600 text-white font-bold px-5 py-2.5 rounded-lg hover:bg-blue-700 transition-all duration-300 shadow">
                    Kayıt Ol
                </a>
            </div>
        </nav>
    </header>

    <main class="flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg mt-10">
            <div>
                <h2 class="text-center text-3xl font-extrabold text-gray-900">
                    Hasta Girişi
                </h2>
            </div>

            <div id="message-area" class="mt-2"></div>

            <form id="giris-formu" class="mt-8 space-y-6">
                <div class="rounded-md shadow-sm -space-y-px">
                    <div>
                        <label for="tc-email" class="sr-only">T.C. Kimlik Numarası veya E-posta</label>
                        <input id="tc-email" name="email" type="text" required 
                            class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" 
                            placeholder="T.C. Kimlik Numarası veya E-posta">
                    </div>
                    <div>
                        <label for="password" class="sr-only">Şifre</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required 
                            class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" 
                            placeholder="Şifre">
                    </div>
                </div>

                <div>
                    <button type="submit" 
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Giriş Yap
                    </button>
                </div>
            </form>

            <div class="text-center">
                <p class="text-sm text-gray-600">
                    Henüz hesabınız yok mu?
                    <a href="hasta-kayit.html" class="font-medium text-blue-600 hover:text-blue-500">
                        Kayıt Ol
                    </a>
                </p>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById('giris-formu');
        const messageArea = document.getElementById('message-area');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            messageArea.innerHTML = '';

            const email = document.getElementById('tc-email').value.trim();
            const sifre = document.getElementById('password').value;

            if (!email || !sifre) {
                messageArea.innerHTML = `
                    <div class="bg-yellow-100 border border-yellow-400 text-yellow-800 px-4 py-3 rounded">
                        ⚠️ Lütfen e-posta/T.C. kimlik ve şifrenizi giriniz.
                    </div>`;
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/giris', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, sifre })
                });

                const data = await response.json();

                if (response.ok) {
                    // ✅ Hasta bilgilerini localStorage’a kaydet
                    localStorage.setItem('hastaBilgisi', JSON.stringify(data.hasta));

                    messageArea.innerHTML = `
                        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                            ✅ ${data.mesaj} Hoş geldin, ${data.hasta.ad}! Yönlendiriliyorsunuz...
                        </div>`;

                    // ✅ Ana sayfaya yönlendir
                    setTimeout(() => window.location.href = '../saglik.html', 2000);
                } else {
                    messageArea.innerHTML = `
                        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                            ❌ ${data.mesaj}
                        </div>`;
                }
            } catch (error) {
                console.error('Sunucu hatası:', error);
                messageArea.innerHTML = `
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                        Sunucuya bağlanılamadı. Lütfen tekrar deneyin.
                    </div>`;
            }
        });
    </script>

</body>
</html>
